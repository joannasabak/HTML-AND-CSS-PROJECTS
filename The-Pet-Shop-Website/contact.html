<!DOCTYPE html>
<html>
    <head>
        <title>Contact Us</title>
        <meta charset="UTF-8">
        <meta name="description" content="Contact details of the pet shop">
        <meta name="keywords" content="HTML, Pets, Shop, Message">
        <meta name="author" content="Joanna">
        <link rel="stylesheet" href="css/style.css">

    <body>
        <font face="Roboto">
        <!---NAVBAR-->
        <nav class="nav-bar">
            <ul id="nav-border">
                <li><a href="index.html">HOME</a></li>
                <li><a href="contact.html">CONTACT</a></li>

            </ul>
        </nav>
        <!--HEADER-->
        <header>
            <div>
                <h1 class="animate">Contact Us!</h1>
            </div>
        </header>

        <!--FORM-->
        <section>
            <div>
                <h3 id="contact-h3">Please provide your contact details and a brief information of your inquiry.</h3>
                <div>
                    <form>
                        <input type="text" placeholder="First Name">
                        <input type="text" placeholder="Last Name"><br>
                        <input type="email" placeholder="Email">
                        <input type="tel" placeholder="Phone Number"><br>
                        <input type="checkbox" id="Newsletter">
                        <label for="Newsletter">Would you like to receive our Newsletter?</label><br>
                        <textarea placeholder="Type message here..."></textarea><br>
                        <input type="submit" value="Submit">
                    </form>
                </div>
            </div>
        </section>
        <!--FOOTER-->
        <footer>
            <table>
                <tr>
                    <td>
                        <p>
                            The Pet Shop! &copy; 2026
                        </p>
                    </td>
                    <td>
                        <p>
                            123 Square Ave<br>
                            Portland, OR 97204
                        </p>
                    </td>
                    <td>
                        <p>
                            503-234-3966
                        </p>
                    </td>
                </tr>
            </table>
        </footer>
        </font>
    </body>
